version: '3.8'

services:
  exaone-eval:
    build:
      context: .
      dockerfile: Dockerfile
    image: exaone-hackathon:latest
    container_name: exaone-eval
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ./:/workspace
      - ~/.cache/huggingface:/root/.cache/huggingface
    shm_size: '16gb'
    stdin_open: true
    tty: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
